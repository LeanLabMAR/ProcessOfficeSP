            { "Capability Name": "10.1.2 Licenciamientos", "Nivel": "3", "C_ID": "10.1.2", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.1.2%20Licenciamiento.aspx" },
            { "Capability Name": "10.1.3 Control Financiero IT", "Nivel": "3", "C_ID": "10.1.3", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.1.1.2%20Control%20financiero%20IT.aspx" },
            { "Capability Name": "10.2 IT Operations", "Nivel": "2", "C_ID": "10.2", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.2%20IT%20Operations.aspx" },
            { "Capability Name": "10.3 Systems", "Nivel": "2", "C_ID": "10.3", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.3%20Systems.aspx" },
            { "Capability Name": "10.4 Architecture", "Nivel": "2", "C_ID": "10.4", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.4%20Architecture.aspx" },
            { "Capability Name": "10.5 Applications", "Nivel": "2", "C_ID": "10.5", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.5%20Applications.aspx" },
            { "Capability Name": "10.6 Networking", "Nivel": "2", "C_ID": "10.6", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.6%20Networking.aspx" },
            { "Capability Name": "10.6.1 Conectividad LAN", "Nivel": "3", "C_ID": "10.6.1", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.6.1%20Conectividad%20LAN.aspx" },
            { "Capability Name": "10.6.2 Conectividad WAN", "Nivel": "3", "C_ID": "10.6.2", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.6.2%20Conectividad%20WAN.aspx" },
            { "Capability Name": "10.6.3 Firewall y Seguridad", "Nivel": "3", "C_ID": "10.6.3", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.6.3%20Firewall%20y%20Seguridad.aspx" },
            { "Capability Name": "10.6.4 Conectividad WLAN", "Nivel": "3", "C_ID": "10.6.4", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.6.4%20Conectividad%20WLAN.aspx" },
            { "Capability Name": "10.7 Telecom", "Nivel": "2", "C_ID": "10.7", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.7%20Telecom.aspx" },
            { "Capability Name": "10.7.1 ACD Telecom MAR", "Nivel": "3", "C_ID": "10.7.1", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.7.2%20Recording.aspx" },
            { "Capability Name": "10.7.2 Recording", "Nivel": "3", "C_ID": "10.7.2", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/10.7.1%20ACD%20Telecom%20MAR.aspx" }
        ];

        function buildTree(flatData) {
            const tree = [];
            const lookup = {};

            flatData.forEach(item => {
                let cleanTitle = item["Capability Name"].replace(/^[0-9\.]+\s*/, '').trim();
                
                lookup[item["C_ID"]] = {
                    id: item["C_ID"],
                    title: cleanTitle,
                    url: item["URL"],
                    children: []
                };
            });

            flatData.forEach(item => {
                const node = lookup[item["C_ID"]];
                const parts = item["C_ID"].split('.');
                
                if (parts.length === 1) {
                    tree.push(node);
                } else {
                    parts.pop(); 
                    const parentId = parts.join('.');
                    
                    if (lookup[parentId]) {
                        lookup[parentId].children.push(node);
                    } else {
                        tree.push(node);
                    }
                }
            });

            return tree;
        }

        const capabilitiesData = buildTree(rawData);

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            const row = document.getElementById(`row-${id}`);
            
            content.classList.toggle('open');
            icon.classList.toggle('rotate-180');
            
            if (content.classList.contains('open')) {
                // Al desplegar oscurecemos sutilmente el morado para dar sensación de profundidad
                row.classList.add('bg-black/20');
            } else {
                row.classList.remove('bg-black/20');
            }
        }

        function renderTree(items, level) {
            if (!items || items.length === 0) return '';
            
            let html = '';
            items.forEach(item => {
                const hasChildren = item.children && item.children.length > 0;
                const uniqueId = item.id.replace(/\./g, '-');
                
                // Configuración de márgenes por profundidad
                let paddingClass = level === 2 ? 'pl-4' : (level === 3 ? 'pl-10' : (level === 4 ? 'pl-16' : 'pl-24'));
                
                // Efecto cristal/oscuro para los subniveles
                let bgClass = level === 2 ? 'bg-transparent' : (level === 3 ? 'bg-black/10' : 'bg-black/20');
                
                // Borde izquierdo para conectar jerarquías
                let borderClass = level > 2 ? 'border-l border-white/10 ml-2' : '';
                
                let cursorClass = hasChildren ? 'cursor-pointer hover:bg-white/10' : 'hover:bg-white/10';
                let onClickAction = hasChildren ? `onclick="toggleAccordion('${uniqueId}')"` : '';
                
                let btnSharePoint = `
                    <a href="${item.url || '#'}" target="_blank" onclick="event.stopPropagation();" title="Abrir en SharePoint" class="relative z-10 flex items-center justify-center p-2 text-white/70 hover:text-white bg-white/5 hover:bg-tp-pink rounded-lg transition-all shrink-0 border border-white/10 hover:border-tp-pink">
                        <i class="ph ph-arrow-square-out text-lg"></i>
                    </a>
                `;

                let toggleIcon = hasChildren ? `
                    <div class="w-6 flex justify-center shrink-0">
                        <i id="icon-${uniqueId}" class="ph ph-caret-down text-white/50 group-hover:text-white transition-transform duration-300"></i>
                    </div>
                ` : `<div class="w-6 shrink-0"></div>`; 

                html += `
                    <div class="border-b border-white/5 last:border-0 ${borderClass}">
                        <div id="row-${uniqueId}" ${onClickAction} class="w-full flex justify-between items-center py-3 pr-3 ${paddingClass} ${bgClass} ${cursorClass} transition-colors duration-200 group min-h-[3.5rem]">
                            
                            <div class="flex items-start gap-3 flex-grow pr-3">
                                <span class="w-8 font-bold ${level === 2 ? 'text-tp-pink' : 'text-tp-slateText'} text-xs shrink-0 mt-[2px] drop-shadow-md">${item.id}</span>
                                <span class="text-sm font-medium text-white/90 leading-snug group-hover:text-white transition-colors">${item.title}</span>
                            </div>
                            
                            <div class="flex items-center gap-1 shrink-0">
                                ${btnSharePoint}
                                ${toggleIcon}
                            </div>
                            
                        </div>
                        
                        ${hasChildren ? `
                        <div id="content-${uniqueId}" class="accordion-grid ${bgClass}">
                            <div class="accordion-inner">
                                ${renderTree(item.children, level + 1)}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;
            });
            return html;
        }

        function renderApp() {
            const gridContainer = document.getElementById('capabilities-grid');
            let htmlContent = '';

            capabilitiesData.forEach(cap => {
                const subCapsCount = cap.children ? cap.children.length : 0;

                htmlContent += `
                    <div class="bg-tp-cardBg rounded-xl shadow-[0_8px_30px_rgba(0,0,0,0.15)] hover:shadow-[0_12px_40px_rgba(0,0,0,0.3)] transition-all duration-300 border-gradient-top border border-white/10 flex flex-col overflow-hidden">
                        
                        <div class="p-5 border-b border-white/10 flex justify-between items-center bg-tp-headerBg sticky top-0 z-10 relative">
                            <div class="flex items-center gap-3 pr-2 relative z-10">
                                <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-tp-pink text-white font-bold text-sm flex-shrink-0 shadow-[0_0_15px_rgba(227,0,117,0.5)]">
                                    ${cap.id}
                                </div>
                                <div class="flex flex-col xl:flex-row xl:items-center gap-1.5 xl:gap-2">
                                    <h3 class="font-bold text-lg text-white leading-tight">${cap.title}</h3>
                                    <span class="inline-flex items-center justify-center px-2 py-0.5 bg-white/10 text-tp-slateText text-[10px] font-bold rounded border border-white/10" title="Contiene ${subCapsCount} sub-capacidades L2">
                                        L2: ${subCapsCount}
                                    </span>
                                </div>
                            </div>
                            
                            <a href="${cap.url || '#'}" target="_blank" onclick="event.stopPropagation();" title="Abrir en SharePoint" class="flex items-center justify-center p-2 text-white bg-white/10 hover:bg-tp-pink rounded-lg shadow-sm transition-colors shrink-0 relative z-10 border border-white/10 hover:border-tp-pink">
                                <i class="ph ph-arrow-square-out text-lg"></i>
                            </a>
                        </div>

                        <div class="flex flex-col bg-transparent">
                            ${renderTree(cap.children, 2)}
                        </div>
                    </div>
                `;
            });

            gridContainer.innerHTML = htmlContent;
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
