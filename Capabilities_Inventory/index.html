            { "Capability Name": "11.2.6 Internal Control for Process Office", "Nivel": "3", "C_ID": "11.2.6", "URL": "https://teleperformance.sharepoint.com/:u:/r/sites/TPMARProcessManagementOffice2/SitePages/8.3.6.aspx" },
            { "Capability Name": "11.3 Business Evolution", "Nivel": "2", "C_ID": "11.3", "URL": "https://teleperformance.sharepoint.com/sites/TPMARProcessManagementOffice2/SitePages/1.2.aspx" }
        ];

        function buildTree(flatData) {
            const tree = [];
            const lookup = {};

            flatData.forEach(item => {
                let cleanTitle = item["Capability Name"].replace(/^[0-9\.]+\s*/, '').trim();
                
                lookup[item["C_ID"]] = {
                    id: item["C_ID"],
                    title: cleanTitle,
                    url: item["URL"],
                    children: []
                };
            });

            flatData.forEach(item => {
                const node = lookup[item["C_ID"]];
                const parts = item["C_ID"].split('.');
                
                if (parts.length === 1) {
                    tree.push(node);
                } else {
                    parts.pop(); 
                    const parentId = parts.join('.');
                    
                    if (lookup[parentId]) {
                        lookup[parentId].children.push(node);
                    } else {
                        tree.push(node);
                    }
                }
            });

            return tree;
        }

        const capabilitiesData = buildTree(rawData);

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            const row = document.getElementById(`row-${id}`);
            
            content.classList.toggle('open');
            icon.classList.toggle('rotate-180');
            
            if (content.classList.contains('open')) {
                row.classList.add('bg-gray-50');
            } else {
                row.classList.remove('bg-gray-50');
            }
        }

        function renderTree(items, level) {
            if (!items || items.length === 0) return '';
            
            let html = '';
            items.forEach(item => {
                const hasChildren = item.children && item.children.length > 0;
                const uniqueId = item.id.replace(/\./g, '-');
                
                // Configuración de márgenes por profundidad
                let paddingClass = level === 2 ? 'pl-4' : (level === 3 ? 'pl-10' : (level === 4 ? 'pl-16' : 'pl-24'));
                
                // Efecto cristal/oscuro para los subniveles
                let bgClass = level === 2 ? 'bg-white' : (level === 3 ? 'bg-gray-50/50' : 'bg-gray-50');
                
                // Borde izquierdo sutil
                let borderClass = level > 2 ? 'border-l border-gray-200 ml-2' : '';
                
                let cursorClass = hasChildren ? 'cursor-pointer hover:bg-gray-50' : 'hover:bg-gray-50';
                let onClickAction = hasChildren ? `onclick="toggleAccordion('${uniqueId}')"` : '';
                
                let btnSharePoint = `
                    <a href="${item.url || '#'}" target="_blank" onclick="event.stopPropagation();" title="Abrir en SharePoint" class="relative z-10 flex items-center justify-center p-1.5 text-gray-400 hover:text-gray-600 transition-colors shrink-0">
                        <i class="ph ph-arrow-square-out text-lg"></i>
                    </a>
                `;

                let toggleIcon = hasChildren ? `
                    <div class="w-6 flex justify-center shrink-0">
                        <i id="icon-${uniqueId}" class="ph ph-caret-down text-gray-400 transition-transform duration-300"></i>
                    </div>
                ` : `<div class="w-6 shrink-0"></div>`; 

                html += `
                    <div class="border-b border-gray-100 last:border-0 ${borderClass}">
                        <div id="row-${uniqueId}" ${onClickAction} class="w-full flex justify-between items-center py-3 pr-3 ${paddingClass} ${bgClass} ${cursorClass} transition-colors duration-200 group min-h-[3.5rem]">
                            
                            <div class="flex items-center gap-3 flex-grow pr-3">
                                <span class="w-8 font-medium text-gray-900 text-xs shrink-0 mt-[1px]">${item.id}</span>
                                <span class="text-sm font-medium text-gray-700 leading-snug group-hover:text-gray-900 transition-colors">${item.title}</span>
                            </div>
                            
                            <div class="flex items-center gap-1 shrink-0">
                                ${btnSharePoint}
                                ${toggleIcon}
                            </div>
                            
                        </div>
                        
                        ${hasChildren ? `
                        <div id="content-${uniqueId}" class="accordion-grid ${bgClass}">
                            <div class="accordion-inner">
                                ${renderTree(item.children, level + 1)}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;
            });
            return html;
        }

        function renderApp() {
            const gridContainer = document.getElementById('capabilities-grid');
            let htmlContent = '';

            capabilitiesData.forEach(cap => {
                const subCapsCount = cap.children ? cap.children.length : 0;

                htmlContent += `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 border border-gray-200 flex flex-col overflow-hidden h-[550px]">
                        
                        <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-20">
                            <div class="flex items-center gap-3 pr-2 relative z-10">
                                <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-700 font-bold text-sm flex-shrink-0">
                                    ${cap.id}
                                </div>
                                <div class="flex flex-col xl:flex-row xl:items-center gap-1.5 xl:gap-2">
                                    <h3 class="font-bold text-lg text-gray-900 leading-tight">${cap.title}</h3>
                                    <span class="inline-flex items-center justify-center px-2 py-0.5 bg-gray-100 text-gray-500 text-[10px] font-bold rounded" title="Contiene ${subCapsCount} sub-capacidades L2">
                                        L2: ${subCapsCount}
                                    </span>
                                </div>
                            </div>
                            
                            <a href="${cap.url || '#'}" target="_blank" onclick="event.stopPropagation();" title="Abrir en SharePoint" class="flex items-center justify-center w-9 h-9 text-white bg-[#44265E] hover:bg-opacity-90 rounded-lg shadow-sm transition-colors shrink-0 relative z-10">
                                <i class="ph ph-arrow-square-out text-lg"></i>
                            </a>
                        </div>

                        <div class="flex flex-col bg-white overflow-y-auto flex-grow relative z-0">
                            ${renderTree(cap.children, 2)}
                        </div>
                    </div>
                `;
            });

            gridContainer.innerHTML = htmlContent;
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
